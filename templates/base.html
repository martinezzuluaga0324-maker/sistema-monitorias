<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Tándem{% endblock %} · Sistema de Monitorías Académicas</title>
<meta name="description" content="Plataforma para solicitar, asignar y hacer seguimiento a monitorías académicas.">
<meta name="theme-color" content="#0c2b2c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='15' cy='20' r='11' fill='%230c2b2c'/%3E%3Ccircle cx='25' cy='20' r='11' fill='%23f0a030' fill-opacity='.9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

{# Símbolos SVG reutilizables (logo e íconos) #}
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo-mark" viewBox="0 0 48 32">
    <circle cx="17" cy="16" r="13" fill="currentColor"/>
    <circle cx="31" cy="16" r="13" fill="#f0a030" style="mix-blend-mode:multiply"/>
  </symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

{% block cuerpo %}{% endblock %}

{# Aviso emergente: los mensajes flash de Flask se muestran con JavaScript #}
<div class="toast" id="toast" role="status" aria-live="polite"
     data-mensajes='{{ get_flashed_messages(with_categories=true) | tojson | forceescape }}'></div>

<script src="{{ url_for('static', filename='js/validacion.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
