{% extends "app_base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Ingresar{% endblock %}

{% block contenido %}
<section class="auth-card">
  <h1>Ingresa a <em>Tándem</em></h1>
  {% if error %}<p class="alerta" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="form form--auth" novalidate data-validar>
    {{ csrf() }}
    <div class="field">
      <label for="correo">Correo institucional</label>
      <input id="correo" name="correo" type="email" autocomplete="email" required placeholder="nombre@universidad.edu.co" value="{{ request.form.get('correo', '') }}">
      <small class="err"></small>
    </div>
    <div class="field">
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required>
      <small class="err"></small>
    </div>
    <button class="btn btn--pill btn--ink">Ingresar</button>
  </form>
  <p class="pie-form">¿Eres estudiante y aún no tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a></p>
</section>
{% endblock %}
